services:
  # 1. Node.js アプリ
  node-app:
    build: .
    command: npx nodemon server.js
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules # ★この1行を必ず追加してください！
    depends_on:
      - db

  # 2. データベース (MySQL)
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: my_app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: